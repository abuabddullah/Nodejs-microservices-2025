services:
  mongo:
    image: mongo:latest
    container_name: mongo-db-template
    restart: always
    networks:
      - app-network
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:latest
    container_name: senaya-redis
    restart: always
    networks:
      - app-network
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
  redis-data:

networks:
  app-network:
    driver: bridge
