# version: "3.9"

services:
  # ============================
  # MongoDB
  # ============================
  mongo:
    image: mongo:latest
    container_name: mongo-db-template
    restart: always
    networks:
      - app-network
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  # ============================
  # Redis
  # ============================
  redis:
    image: redis:latest
    container_name: redis-local
    restart: always
    networks:
      - app-network
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================
  # Zookeeper (for Kafka)
  # ============================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    networks:
      - app-network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # ============================
  # Kafka Broker
  # ============================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    networks:
      - app-network
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  # ============================
  # Kafka UI (Kafka-UI)
  # ============================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    networks:
      - app-network
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    depends_on:
      - kafka

# ============================
# Volumes
# ============================
volumes:
  mongo-data:
  redis-data:

# ============================
# Network
# ============================
networks:
  app-network:
    driver: bridge
